# Tasks API Contract

**Feature**: Full-Stack Todo Web Application (Phase-II)
**API Version**: 1.0
**Date**: 2026-01-04

## Overview

This contract defines the tasks API endpoints for the Full-Stack Todo Web Application. All endpoints require JWT-based authentication and enforce multi-user task isolation.

## Base URL

```
https://api.example.com/v1
```

## Common Headers

All requests must include:

- `Content-Type: application/json` (for requests with body)
- `Authorization: Bearer <jwt_token>` (for authenticated requests)

## Authentication Requirement

All endpoints require a valid JWT token in the Authorization header. The token must contain the user ID to enforce multi-user isolation.

## Tasks Endpoints

### GET /tasks

**Description**: Retrieve all tasks for the authenticated user

**Headers**:
- `Authorization: Bearer <valid_token>`

**Query Parameters**:
- `completed` (optional): Filter by completion status (true/false)
- `limit` (optional): Number of tasks to return (default: 50, max: 100)
- `offset` (optional): Number of tasks to skip (for pagination)

**Success Response** (200 OK):
```json
{
  "tasks": [
    {
      "id": "uuid-string",
      "title": "Task title",
      "description": "Optional description",
      "is_completed": false,
      "created_at": "2023-01-01T00:00:00Z",
      "updated_at": "2023-01-01T00:00:00Z",
      "due_date": "2023-01-01T00:00:00Z",
      "priority": "medium",
      "user_id": "user-uuid-string"
    }
  ],
  "total": 25,
  "limit": 50,
  "offset": 0
}
```

**Error Responses**:
- 401: Invalid/missing token
- 500: Server error

### POST /tasks

**Description**: Create a new task for the authenticated user

**Headers**:
- `Authorization: Bearer <valid_token>`

**Request Body**:
```json
{
  "title": "Task title",
  "description": "Optional description",
  "due_date": "2023-12-31T23:59:59Z",
  "priority": "medium"
}
```

**Validation**:
- Title is required and must not be empty
- Title must be less than 255 characters
- Description, if provided, must be less than 1000 characters
- Due date, if provided, must be valid date format
- Priority must be one of: 'low', 'medium', 'high'

**Success Response** (201 Created):
```json
{
  "id": "uuid-string",
  "title": "Task title",
  "description": "Optional description",
  "is_completed": false,
  "created_at": "2023-01-01T00:00:00Z",
  "updated_at": "2023-01-01T00:00:00Z",
  "due_date": "2023-12-31T23:59:59Z",
  "priority": "medium",
  "user_id": "user-uuid-string"
}
```

**Error Responses**:
- 400: Invalid input data
- 401: Invalid/missing token
- 500: Server error

### GET /tasks/{task_id}

**Description**: Retrieve a specific task for the authenticated user

**Headers**:
- `Authorization: Bearer <valid_token>`

**Path Parameters**:
- `task_id`: UUID of the task to retrieve

**Success Response** (200 OK):
```json
{
  "id": "uuid-string",
  "title": "Task title",
  "description": "Optional description",
  "is_completed": false,
  "created_at": "2023-01-01T00:00:00Z",
  "updated_at": "2023-01-01T00:00:00Z",
  "due_date": "2023-12-31T23:59:59Z",
  "priority": "medium",
  "user_id": "user-uuid-string"
}
```

**Error Responses**:
- 401: Invalid/missing token
- 403: Task does not belong to user
- 404: Task not found
- 500: Server error

### PUT /tasks/{task_id}

**Description**: Update a specific task for the authenticated user

**Headers**:
- `Authorization: Bearer <valid_token>`

**Path Parameters**:
- `task_id`: UUID of the task to update

**Request Body**:
```json
{
  "title": "Updated task title",
  "description": "Updated description",
  "is_completed": true,
  "due_date": "2023-12-31T23:59:59Z",
  "priority": "high"
}
```

**Success Response** (200 OK):
```json
{
  "id": "uuid-string",
  "title": "Updated task title",
  "description": "Updated description",
  "is_completed": true,
  "created_at": "2023-01-01T00:00:00Z",
  "updated_at": "2023-01-02T00:00:00Z",
  "due_date": "2023-12-31T23:59:59Z",
  "priority": "high",
  "user_id": "user-uuid-string"
}
```

**Error Responses**:
- 400: Invalid input data
- 401: Invalid/missing token
- 403: Task does not belong to user
- 404: Task not found
- 500: Server error

### PATCH /tasks/{task_id}

**Description**: Partially update a specific task for the authenticated user (e.g., toggle completion status)

**Headers**:
- `Authorization: Bearer <valid_token>`

**Path Parameters**:
- `task_id`: UUID of the task to update

**Request Body** (partial update):
```json
{
  "is_completed": true
}
```

**Success Response** (200 OK):
```json
{
  "id": "uuid-string",
  "title": "Task title",
  "description": "Optional description",
  "is_completed": true,
  "created_at": "2023-01-01T00:00:00Z",
  "updated_at": "2023-01-02T00:00:00Z",
  "due_date": "2023-12-31T23:59:59Z",
  "priority": "medium",
  "user_id": "user-uuid-string"
}
```

**Error Responses**:
- 400: Invalid input data
- 401: Invalid/missing token
- 403: Task does not belong to user
- 404: Task not found
- 500: Server error

### DELETE /tasks/{task_id}

**Description**: Delete a specific task for the authenticated user

**Headers**:
- `Authorization: Bearer <valid_token>`

**Path Parameters**:
- `task_id`: UUID of the task to delete

**Success Response** (204 No Content)

**Error Responses**:
- 401: Invalid/missing token
- 403: Task does not belong to user
- 404: Task not found
- 500: Server error

## Security Considerations

1. **Multi-user Isolation**: All endpoints must verify that the requested task belongs to the authenticated user
2. **Authentication**: All endpoints require valid JWT token
3. **Authorization**: Users can only access their own tasks
4. **Input Validation**: All inputs must be validated and sanitized
5. **Rate Limiting**: API endpoints should implement rate limiting to prevent abuse