## Reminder Events Contract

### Reminder Set Event
**Topic**: `reminders`
**Event Type**: `reminder.set`

```json
{
  "event_type": "reminder.set",
  "task_id": "uuid-string",
  "user_id": "uuid-string",
  "reminder_at": "2024-12-31T23:59:59Z",
  "due_date": "2024-12-31T23:59:59Z",
  "title": "Task with reminder"
}
```

## UI Sync Events Contract

### Task Sync Event
**Topic**: `task-updates`
**Event Types**: `task.created`, `task.updated`, `task.completed`, `task.deleted`

```json
{
  "event_type": "task.created|task.updated|task.completed|task.deleted",
  "task_id": "uuid-string",
  "user_id": "uuid-string",
  "action": "created|updated|completed|deleted",
  "timestamp": "2024-12-31T23:59:59Z",
  "payload": {
    // Minimal task data for UI updates
    "id": "uuid-string",
    "title": "Task title",
    "is_completed": false,
    "due_date": "2024-12-31T23:59:59Z"
  }
}
```