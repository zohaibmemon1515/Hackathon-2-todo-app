# API Contracts: Kafka Event Integration

## Task Events Contract

### Task Created Event
**Topic**: `task-events`
**Event Type**: `task.created`

```json
{
  "event_type": "task.created",
  "task_id": "uuid-string",
  "user_id": "uuid-string",
  "title": "Task title",
  "priority": "high|medium|low",
  "due_date": "2024-12-31T23:59:59Z",
  "reminder_at": "2024-12-31T23:59:59Z",
  "tags": ["tag1", "tag2"],
  "is_completed": false,
  "timestamp": "2024-12-31T23:59:59Z"
}
```

